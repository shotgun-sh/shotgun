[tool:pytest]
# Configuration for integration tests
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that require LLM configuration
    slow: Tests that take a long time to run
    llm: Tests that make actual LLM calls

# Async support
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
addopts = 
    --strict-markers
    --tb=short
    -v
    
# Timeout for tests (in seconds)
timeout = 300

# Minimum coverage
[coverage:run]
source = ../../../src/shotgun/codebase
omit = 
    */test*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: