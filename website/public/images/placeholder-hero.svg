  <text x="120" y="295" font-family="monospace" font-size="14" fill="#a5d6a7">✓ 847 files indexed</text>
  <text x="120" y="320" font-family="monospace" font-size="14" fill="#a5d6a7">✓ Spec generated</text>

  <!-- Side panel -->
  <rect x="600" y="120" width="500" height="500" rx="6" fill="#0d1117" opacity="0.5"/>
  <rect x="620" y="140" width="180" height="14" rx="3" fill="#f97316" opacity="0.7"/>
  <rect x="620" y="170" width="440" height="10" rx="3" fill="#5a8ed4" opacity="0.3"/>
  <rect x="620" y="190" width="400" height="10" rx="3" fill="#5a8ed4" opacity="0.3"/>
  <rect x="620" y="210" width="420" height="10" rx="3" fill="#5a8ed4" opacity="0.3"/>

  <!-- Stage indicators -->
  <rect x="620" y="250" width="460" height="40" rx="6" fill="#16a34a" opacity="0.2"/>
  <text x="640" y="275" font-family="sans-serif" font-size="13" fill="#a5d6a7">Stage 1: Research</text>
  <text x="1020" y="275" font-family="sans-serif" font-size="13" fill="#a5d6a7">✓</text>

  <rect x="620" y="300" width="460" height="40" rx="6" fill="#16a34a" opacity="0.2"/>
  <text x="640" y="325" font-family="sans-serif" font-size="13" fill="#a5d6a7">Stage 2: Specification</text>
  <text x="1020" y="325" font-family="sans-serif" font-size="13" fill="#a5d6a7">✓</text>

  <rect x="620" y="350" width="460" height="40" rx="6" fill="#3b82f6" opacity="0.2"/>
  <text x="640" y="375" font-family="sans-serif" font-size="13" fill="#93c5fd">Stage 3: Planning</text>
  <text x="1000" y="375" font-family="sans-serif" font-size="13" fill="#93c5fd">...</text>

  <rect x="620" y="400" width="460" height="40" rx="6" fill="#404040" opacity="0.3"/>
  <text x="640" y="425" font-family="sans-serif" font-size="13" fill="#737373">Stage 4: Tasks</text>

  <rect x="620" y="450" width="460" height="40" rx="6" fill="#404040" opacity="0.3"/>
  <text x="640" y="475" font-family="sans-serif" font-size="13" fill="#737373">Stage 5: Export</text>

  <!-- Metrics -->
  <rect x="100" y="370" width="460" height="100" rx="6" fill="#0d1117" opacity="0.5"/>
  <text x="120" y="400" font-family="sans-serif" font-size="12" fill="#737373">FILES ANALYZED</text>
  <text x="120" y="430" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f97316">847</text>
  <text x="260" y="400" font-family="sans-serif" font-size="12" fill="#737373">SPECS GENERATED</text>
  <text x="260" y="430" font-family="sans-serif" font-size="28" font-weight="bold" fill="#3b82f6">12</text>
  <text x="400" y="400" font-family="sans-serif" font-size="12" fill="#737373">TIME SAVED</text>
  <text x="400" y="430" font-family="sans-serif" font-size="28" font-weight="bold" fill="#16a34a">3wks</text>
