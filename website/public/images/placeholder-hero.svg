<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#152d54;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" rx="12"/>

  <!-- Window chrome -->
  <rect x="80" y="60" width="1040" height="680" rx="8" fill="#1a1a2e" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="80" y="60" width="1040" height="40" rx="8" fill="#1a1a2e"/>
  <circle cx="108" cy="80" r="6" fill="#ff5f57"/>
  <circle cx="128" cy="80" r="6" fill="#febc2e"/>
  <circle cx="148" cy="80" r="6" fill="#28c840"/>

  <!-- Content area -->
  <rect x="100" y="120" width="300" height="16" rx="4" fill="#3a6bb5" opacity="0.6"/>
  <rect x="100" y="150" width="240" height="12" rx="3" fill="#5a8ed4" opacity="0.4"/>
  <rect x="100" y="175" width="280" height="12" rx="3" fill="#5a8ed4" opacity="0.3"/>

  <!-- Code block -->
  <rect x="100" y="210" width="460" height="120" rx="6" fill="#0d1117"/>
  <text x="120" y="245" font-family="monospace" font-size="14" fill="#8ab4e8">$ uvx shotgun-sh@latest</text>
