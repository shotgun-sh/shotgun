<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#152d54;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fafafa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect width="1280" height="720" rx="12" fill="#1b1b1f" />
  <!-- Title bar -->
  <rect width="1280" height="36" rx="12" fill="#2a2a2e" />
  <rect y="24" width="1280" height="12" fill="#2a2a2e" />
  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57" />
  <circle cx="40" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="18" r="6" fill="#28c840" />
  <!-- Tab -->
  <rect x="100" y="6" width="180" height="24" rx="6" fill="#1b1b1f" />
  <text x="140" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#a3a3a3">Shotgun — Workspace</text>

  <!-- Sidebar -->
