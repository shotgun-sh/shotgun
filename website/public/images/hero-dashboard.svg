  <text x="24" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#8ab4e8">my-saas-app</text>
  <text x="24" y="362" font-family="system-ui, sans-serif" font-size="11" fill="#3a6bb5">12 files analyzed</text>

