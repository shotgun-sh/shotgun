  <rect x="296" y="190" width="430" height="36" rx="4" fill="#eff6ff" />
  <circle cx="316" cy="208" r="8" fill="#16a34a" />
  <text x="310" y="212" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">&#10003;</text>
  <text x="332" y="213" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#171717">LiteLLM Proxy — Usage-based billing for LLM calls</text>
  <rect x="296" y="234" width="430" height="36" rx="4" fill="#f5f5f5" />
  <circle cx="316" cy="252" r="8" fill="#d4d4d4" />
  <text x="332" y="257" font-family="system-ui, sans-serif" font-size="13" fill="#525252">OpenMeter — Generic usage metering</text>
  <rect x="296" y="278" width="430" height="36" rx="4" fill="#f5f5f5" />
  <circle cx="316" cy="296" r="8" fill="#d4d4d4" />
  <text x="332" y="301" font-family="system-ui, sans-serif" font-size="13" fill="#525252">Custom Proxy — Build from scratch (4 weeks est.)</text>
  <!-- Recommendation badge -->
  <rect x="296" y="330" width="120" height="24" rx="12" fill="#16a34a" opacity="0.1" />
  <text x="312" y="346" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#16a34a">Recommended</text>
  <text x="424" y="346" font-family="system-ui, sans-serif" font-size="11" fill="#525252">Use LiteLLM Proxy — 5 day implementation</text>

