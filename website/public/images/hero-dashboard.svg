  <text x="44" y="165" font-family="system-ui, sans-serif" font-size="13" fill="#5a8ed4">Specifications</text>
  <text x="44" y="197" font-family="system-ui, sans-serif" font-size="13" fill="#5a8ed4">Planning</text>
  <text x="44" y="229" font-family="system-ui, sans-serif" font-size="13" fill="#5a8ed4">Tasks</text>
  <text x="44" y="261" font-family="system-ui, sans-serif" font-size="13" fill="#5a8ed4">Export</text>
  <!-- Sidebar icons -->
  <circle cx="28" cy="120" r="4" fill="#f97316" />
  <circle cx="28" cy="160" r="4" fill="#3a6bb5" />
  <circle cx="28" cy="192" r="4" fill="#3a6bb5" />
  <circle cx="28" cy="224" r="4" fill="#3a6bb5" />
  <circle cx="28" cy="256" r="4" fill="#3a6bb5" />
