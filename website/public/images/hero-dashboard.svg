  <text x="796" y="200" font-family="system-ui, sans-serif" font-size="12" fill="#525252">Patterns Detected</text>
  <rect x="796" y="210" width="200" height="6" rx="3" fill="#e5e5e5" />
  <rect x="796" y="210" width="180" height="6" rx="3" fill="#3b82f6" />
  <text x="1004" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#737373">18/20</text>
  <text x="796" y="244" font-family="system-ui, sans-serif" font-size="12" fill="#525252">Dependencies Mapped</text>
  <rect x="796" y="254" width="200" height="6" rx="3" fill="#e5e5e5" />
  <rect x="796" y="254" width="166" height="6" rx="3" fill="#f97316" />
  <text x="1004" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#737373">42 pkgs</text>
  <text x="796" y="288" font-family="system-ui, sans-serif" font-size="12" fill="#525252">Existing Auth System</text>
  <rect x="796" y="298" width="200" height="6" rx="3" fill="#e5e5e5" />
  <rect x="796" y="298" width="200" height="6" rx="3" fill="#16a34a" />
  <text x="1004" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#737373">Found</text>
  <!-- Architecture note -->
  <rect x="796" y="326" width="430" height="48" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
  <text x="816" y="348" font-family="system-ui, sans-serif" font-size="12" fill="#9a3412" font-weight="500">Existing billing module detected in src/billing/</text>
  <text x="816" y="364" font-family="system-ui, sans-serif" font-size="11" fill="#c2410c">Integration recommended over rebuild</text>

  <!-- Workflow progress bar at bottom -->
  <rect x="240" y="668" width="1040" height="52" fill="#ffffff" />
  <line x1="240" y1="668" x2="1280" y2="668" stroke="#e5e5e5" stroke-width="1" />
  <!-- Progress stages -->
  <circle cx="340" cy="694" r="12" fill="#16a34a" />
  <text x="340" y="698" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="370" y="698" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a" font-weight="500">Research</text>
  <line x1="430" y1="694" x2="520" y2="694" stroke="#e5e5e5" stroke-width="2" />
  <circle cx="550" cy="694" r="12" fill="#e5e5e5" stroke="#3b82f6" stroke-width="2" />
  <text x="550" y="698" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="700">2</text>
  <text x="580" y="698" font-family="system-ui, sans-serif" font-size="11" fill="#525252">Specification</text>
  <line x1="670" y1="694" x2="760" y2="694" stroke="#e5e5e5" stroke-width="2" />
  <circle cx="790" cy="694" r="12" fill="#e5e5e5" />
  <text x="790" y="698" font-family="system-ui, sans-serif" font-size="10" fill="#737373" text-anchor="middle">3</text>
  <text x="820" y="698" font-family="system-ui, sans-serif" font-size="11" fill="#a3a3a3">Planning</text>
  <line x1="890" y1="694" x2="980" y2="694" stroke="#e5e5e5" stroke-width="2" />
  <circle cx="1010" cy="694" r="12" fill="#e5e5e5" />
  <text x="1010" y="698" font-family="system-ui, sans-serif" font-size="10" fill="#737373" text-anchor="middle">4</text>
  <text x="1040" y="698" font-family="system-ui, sans-serif" font-size="11" fill="#a3a3a3">Tasks</text>
  <line x1="1090" y1="694" x2="1150" y2="694" stroke="#e5e5e5" stroke-width="2" />
  <circle cx="1180" cy="694" r="12" fill="#e5e5e5" />
  <text x="1180" y="698" font-family="system-ui, sans-serif" font-size="10" fill="#737373" text-anchor="middle">5</text>
  <text x="1210" y="698" font-family="system-ui, sans-serif" font-size="11" fill="#a3a3a3">Export</text>
