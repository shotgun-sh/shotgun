  <rect x="772" y="112" width="476" height="280" rx="8" fill="url(#cardGrad)" stroke="#e5e5e5" stroke-width="1" />
  <text x="796" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f97316" text-transform="uppercase" letter-spacing="1">CODEBASE ANALYSIS</text>
  <text x="796" y="172" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#171717">Architecture Overview</text>
