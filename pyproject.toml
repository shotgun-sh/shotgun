[project]
name = "shotgun"
version = "0.1.0"
description = "Shotgun - A Python CLI tool"
readme = "README.md"
authors = [
    { name = "Proofs.io", email = "hello@proofs.io" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic-ai>=0.0.14",
    "httpx>=0.27.0",
    "openinference-instrumentation-pydantic-ai",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-api",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "lefthook>=1.12.0",
    "commitizen>=3.13.0",
]

[project.scripts]
shotgun = "shotgun.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build]
sources = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4", "PIE", "T20"]
ignore = ["E501", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.commitizen]
# NOTE: Keep allowed types in sync with .github/workflows/pr.yml
# Using cz_conventional_commits with standard types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "debugpy>=1.8.16",
]
