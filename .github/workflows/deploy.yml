name: Deploy to PyPI

on:
  push:
    tags:
      # Match version tags like 0.1.0, 1.2.3, 0.1.0.dev4, 1.0.0rc1, etc.
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff
        run: uv run ruff check src/

      - name: Run ruff format check
        run: uv run ruff format --check src/

      - name: Run mypy
        run: uv run mypy src/

      - name: Run unit tests
        run: |
          echo "Running unit tests only (integration tests skipped for faster deployment)"
          uv run pytest test/unit/ -v
          # Future: When tests are marked with smoke_test, use:
          # uv run pytest test/unit/ -m smoke_test -v

  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      is_dev: ${{ steps.version_update.outputs.is_dev }}
      version: ${{ steps.version_update.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update version from tag and determine release type
        id: version_update
        run: |
          # Extract version from tag (remove 'v' prefix if present)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG_VERSION"

          # Get current version from pyproject.toml for logging
          OLD_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Current pyproject.toml version: $OLD_VERSION"

          # Update pyproject.toml with the tag version
          sed -i "s/^version = .*/version = \"$TAG_VERSION\"/" pyproject.toml

          # Verify the update
          NEW_VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          if [[ "$NEW_VERSION" != "$TAG_VERSION" ]]; then
            echo "❌ Error: Failed to update version in pyproject.toml"
            exit 1
          fi

          echo "✅ Successfully updated pyproject.toml version from $OLD_VERSION to $NEW_VERSION"

          # Determine if this is a development/pre-release version
          if [[ "$TAG_VERSION" == *"dev"* ]] || [[ "$TAG_VERSION" == *"rc"* ]] || [[ "$TAG_VERSION" == *"alpha"* ]] || [[ "$TAG_VERSION" == *"beta"* ]]; then
            echo "📦 This is a DEVELOPMENT/PRE-RELEASE version"
            echo "is_dev=true" >> $GITHUB_OUTPUT
          else
            echo "🚀 This is a RELEASE version"
            echo "is_dev=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        env:
          # Require validation for production builds - fail if secrets are missing
          SHOTGUN_BUILD_REQUIRE_VALIDATION: "true"
          # Map GitHub secrets to SHOTGUN_ prefixed environment variables for build
          SHOTGUN_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SHOTGUN_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SHOTGUN_POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          # Logfire configuration for dev builds only
          SHOTGUN_LOGFIRE_TOKEN: ${{ steps.version_update.outputs.is_dev == 'true' && secrets.LOGFIRE_TOKEN || '' }}
          SHOTGUN_LOGFIRE_ENABLED: ${{ steps.version_update.outputs.is_dev == 'true' && 'true' || '' }}
        run: |
          echo "🔨 Building package version: ${{ steps.version_update.outputs.version }}"
          if [[ -n "$SHOTGUN_SENTRY_DSN" ]] || [[ -n "$SHOTGUN_POSTHOG_API_KEY" ]] || [[ "$SHOTGUN_LOGFIRE_ENABLED" == "true" ]]; then
            [[ -n "$SHOTGUN_SENTRY_DSN" ]] && echo "✅ Building with Sentry integration enabled"
            [[ -n "$SHOTGUN_POSTHOG_API_KEY" ]] && echo "✅ Building with PostHog analytics enabled"
            [[ "$SHOTGUN_LOGFIRE_ENABLED" == "true" ]] && echo "✅ Building with Logfire observability enabled (dev build)"
          else
            echo "⚠️  Building without analytics (Sentry/PostHog/Logfire will use fallback)"
          fi
          python -m build

      - name: Verify package version
        run: |
          EXPECTED_VERSION="${{ steps.version_update.outputs.version }}"
          echo "Verifying package version matches tag: $EXPECTED_VERSION"

          # Check wheel package
          WHEEL_FILE=$(ls dist/*.whl)
          if [[ "$WHEEL_FILE" == *"shotgun_sh-${EXPECTED_VERSION}"* ]]; then
            echo "✅ Wheel package version correct: $WHEEL_FILE"
          else
            echo "❌ Wheel package version mismatch: $WHEEL_FILE"
            exit 1
          fi

          # Check source distribution
          TAR_FILE=$(ls dist/*.tar.gz)
          if [[ "$TAR_FILE" == *"shotgun_sh-${EXPECTED_VERSION}"* ]]; then
            echo "✅ Source distribution version correct: $TAR_FILE"
          else
            echo "❌ Source distribution version mismatch: $TAR_FILE"
            exit 1
          fi

      - name: Check package with twine
        run: |
          echo "🔍 Checking package with twine..."
          twine check dist/*

      - name: List build artifacts
        run: |
          echo "📦 Built packages:"
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

  deploy-to-pypi:
    runs-on: ubuntu-latest
    needs: [run-tests, build-and-package]
    # Uncomment if you have a configured environment in GitHub
    # environment:
    #   name: pypi
    #   url: https://pypi.org/project/shotgun-sh/

    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-packages
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Verify package before deployment
        run: |
          EXPECTED_VERSION="${{ needs.build-and-package.outputs.version }}"
          echo "🔍 Verifying packages before deployment..."
          echo "Expected version: $EXPECTED_VERSION"

          ls -la dist/

          # Verify the package names and versions
          for file in dist/*; do
            if [[ "$file" == *"shotgun_sh-${EXPECTED_VERSION}"* ]]; then
              echo "✅ Package verified: $(basename $file)"
            else
              echo "❌ Unexpected package found: $(basename $file)"
              exit 1
            fi
          done

      - name: Deploy to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [[ "${{ needs.build-and-package.outputs.is_dev }}" == "true" ]]; then
            echo "📦 Deploying DEVELOPMENT/PRE-RELEASE version ${{ needs.build-and-package.outputs.version }} to PyPI..."
          else
            echo "🚀 Deploying RELEASE version ${{ needs.build-and-package.outputs.version }} to PyPI..."
          fi

          # Upload to PyPI
          twine upload dist/*

          echo "✅ Successfully deployed version ${{ needs.build-and-package.outputs.version }} to PyPI!"
          echo "View at: https://pypi.org/project/shotgun-sh/${{ needs.build-and-package.outputs.version }}/"

  create-github-release:
    runs-on: ubuntu-latest
    needs: [build-and-package, deploy-to-pypi]
    if: needs.build-and-package.outputs.is_dev == 'false'  # Only create GitHub releases for stable versions
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist-packages
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.build-and-package.outputs.version }}
          body: |
            ## 🚀 Release v${{ needs.build-and-package.outputs.version }}

            ### Installation

            **Using uvx (Recommended - 10-100x faster):**

            First, install uv if you don't have it:
            ```bash
            curl -LsSf https://astral.sh/uv/install.sh | sh
            # Or with Homebrew: brew install uv
            ```

            Then install shotgun-sh:
            ```bash
            # Quick start (ephemeral)
            uvx shotgun-sh

            # Or install permanently
            uv tool install shotgun-sh==${{ needs.build-and-package.outputs.version }}
            ```

            **Using pipx:**
            ```bash
            pipx install shotgun-sh==${{ needs.build-and-package.outputs.version }}
            ```

            ### PyPI
            View on PyPI: https://pypi.org/project/shotgun-sh/${{ needs.build-and-package.outputs.version }}/

            ### What's Changed
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: dist/*
          draft: false
          prerelease: false

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: [build-and-package, deploy-to-pypi]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shotgun-sh/shotgun
          tags: |
            # Tag with version number (e.g., v0.1.0)
            type=semver,pattern=v{{version}},value=${{ needs.build-and-package.outputs.version }}
            # Tag with 'latest' for stable releases only
            type=raw,value=latest,enable=${{ needs.build-and-package.outputs.is_dev == 'false' }}
            # Tag with 'dev' for development releases
            type=raw,value=dev,enable=${{ needs.build-and-package.outputs.is_dev == 'true' }}
          labels: |
            org.opencontainers.image.title=Shotgun
            org.opencontainers.image.description=AI-powered CLI tool for research, planning, and task management. Always use :latest for production - :dev versions have full telemetry and never auto-update.
            org.opencontainers.image.version=${{ needs.build-and-package.outputs.version }}
            org.opencontainers.image.source=https://github.com/shotgun-sh/shotgun
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Shotgun
            org.opencontainers.image.url=https://shotgun.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SHOTGUN_BUILD_REQUIRE_VALIDATION=true
            SHOTGUN_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SHOTGUN_POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
            SHOTGUN_POSTHOG_PROJECT_ID=${{ secrets.POSTHOG_PROJECT_ID }}
            SHOTGUN_LOGFIRE_ENABLED=${{ needs.build-and-package.outputs.is_dev == 'true' && 'true' || '' }}
            SHOTGUN_LOGFIRE_TOKEN=${{ needs.build-and-package.outputs.is_dev == 'true' && secrets.LOGFIRE_TOKEN || '' }}

  notify-slack:
    runs-on: ubuntu-latest
    needs: [build-and-package, deploy-to-pypi]
    if: always() && needs.deploy-to-pypi.result == 'success'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Get full history for changelog

      - name: Get changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "No previous tag found, getting last 10 commits"
            CHANGELOG=$(git log --oneline -10)
          else
            echo "Getting commits since $PREVIOUS_TAG"
            CHANGELOG=$(git log --oneline ${PREVIOUS_TAG}..HEAD)
          fi

          # Limit length and store raw (we'll escape in the next step)
          CHANGELOG=$(echo "$CHANGELOG" | head -20)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SHOTGUN_ALPHA_WEBHOOK }}
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          IS_DEV="${{ needs.build-and-package.outputs.is_dev }}"
          CHANGELOG_RAW="${{ steps.changelog.outputs.changelog }}"

          # Properly escape changelog for JSON using printf and jq
          # This ensures all special characters are properly escaped
          CHANGELOG_ESCAPED=$(printf '%s' "$CHANGELOG_RAW" | jq -Rs . | sed 's/^"//;s/"$//')

          # Create JSON payload for Slack
          if [[ "$IS_DEV" == "true" ]]; then
            # Development release message
            cat <<EOF > /tmp/slack_payload.json
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "📦 Shotgun Development Release: v${VERSION}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<!channel> New development release is available!\n\n<@U07EGE0FPT5> - A new Shotgun development version has been deployed! 🎉"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Installation Instructions:*\n\nFirst, install uv if you don't have it:\n\`\`\`\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n# Or: brew install uv\n\`\`\`\n\nThen run this version:\n\`\`\`\nuvx --no-cache --from shotgun-sh==${VERSION} shotgun\n\n# Or install permanently:\nuv tool install shotgun-sh==${VERSION}\n\`\`\`\n\n💡 *Tip:* If you have a previous version installed via pipx or uv, uninstall it first:\n\`\`\`\npipx uninstall shotgun-sh  # if using pipx\n# or\nuv tool uninstall shotgun-sh  # if using uv tool\n\`\`\`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Warning:* You might need to wait a minute for this version to be available for installation, as it was just published.\n\nThis is a pre-release development version for testing."
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Recent Changes:*\n\`\`\`\n${CHANGELOG_ESCAPED}\n\`\`\`"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "📦 <https://pypi.org/project/shotgun-sh/${VERSION}/|View on PyPI> | 🐙 <https://github.com/${{ github.repository }}/releases/tag/${VERSION}|View on GitHub>"
                }
              }
            ]
          }
          EOF
          else
            # Stable release message
            cat <<EOF > /tmp/slack_payload.json
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚀 Shotgun Stable Release: v${VERSION}",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "<!channel> New stable release is now available!\n\n<@U07EGE0FPT5> - A new stable version of Shotgun has been released! 🚀"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Installation Instructions:*\n\nFirst, install uv if you don't have it:\n\`\`\`\ncurl -LsSf https://astral.sh/uv/install.sh | sh\n# Or: brew install uv\n\`\`\`\n\nThen install shotgun-sh:\n\`\`\`\n# Quick start (always latest):\nuvx shotgun-sh\n\n# Or install this specific version:\nuvx --no-cache --from shotgun-sh==${VERSION} shotgun\n\n# Or install permanently:\nuv tool install shotgun-sh==${VERSION}\n\`\`\`\n\n💡 *Tip:* If you have a previous version installed via pipx or uv, uninstall it first:\n\`\`\`\npipx uninstall shotgun-sh  # if using pipx\n# or\nuv tool uninstall shotgun-sh  # if using uv tool\n\`\`\`"
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "⚠️ *Warning:* You might need to wait a minute for this version to be available, as it was just published.\n\n✨ *Note for regular users:* You don't need to specify the version number. Simply use \`uvx shotgun-sh\` or \`uv tool install shotgun-sh\` to get the latest stable release.\n\n📦 *About uv:* uv is the modern, fast Python package installer (10-100x faster than pip/pipx). Auto-updates work with \`uv tool install\` but not with ephemeral \`uvx\` execution."
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Recent Changes:*\n\`\`\`\n${CHANGELOG_ESCAPED}\n\`\`\`"
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "📦 <https://pypi.org/project/shotgun-sh/${VERSION}/|View on PyPI> | 🐙 <https://github.com/${{ github.repository }}/releases/tag/${VERSION}|View on GitHub>"
                }
              }
            ]
          }
          EOF
          fi

          # Send to Slack
          curl -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack_payload.json \
            "$SLACK_WEBHOOK_URL"

          echo "✅ Slack notification sent for version ${VERSION}"
