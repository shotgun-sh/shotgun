name: PR Checks

on:
  pull_request:
    branches: [main]

env:
  COVERAGE_THRESHOLD: 51.0

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          # NOTE: Keep these types in sync with cz_conventional_commits in pyproject.toml
          # Standard Conventional Commits types as used by commitizen
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          validateSingleCommit: false
          ignoreLabels: |
            skip-validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  basic-pr-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run ruff
        run: uv run ruff check src/
        
      - name: Run ruff format check
        run: uv run ruff format --check src/
        
      - name: Run mypy
        run: uv run mypy src/
        
      - name: Run unit tests with coverage
        run: uv run pytest test/unit/ --cov=src --cov-report= --cov-append

      - name: Generate coverage reports
        run: |
          uv run coverage report --show-missing
          uv run coverage xml
        
      - name: Check core coverage (${{ env.COVERAGE_THRESHOLD }}% minimum, excluding CLI/TUI)
        run: |
          # Use combined coverage data from both unit and integration tests
          # excluding CLI and TUI directories
          echo "Checking combined coverage for core functionality (excluding CLI/TUI)..."

          # Run coverage report with specific omit patterns for CLI/TUI and extract percentage
          COVERAGE_LINE=$(uv run coverage report --omit="*/cli/*,*/tui/*" | grep "^TOTAL" | awk '{print $NF}' | sed 's/%//')
          COVERAGE_OUTPUT=${COVERAGE_LINE:-0}

          echo "Core coverage: ${COVERAGE_OUTPUT}%"
          echo ""
          echo "Current coverage by file (excluding CLI/TUI):"
          uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing
          echo ""

          # Check if coverage meets threshold using bc for decimal comparison
          if (( $(echo "${COVERAGE_OUTPUT} < ${COVERAGE_THRESHOLD}" | bc -l) )); then
              echo "❌ Coverage check failed: ${COVERAGE_OUTPUT}% < ${COVERAGE_THRESHOLD}%"
              echo ""
              echo "Please add tests to improve coverage of core functionality"
              echo "Focus on: agents/, config/, tools/, models/, history/ directories"
              echo ""
              echo "Low coverage files that need attention:"
              uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing | grep -E "^\w" | awk -v threshold="${COVERAGE_THRESHOLD}" '$NF ~ /%/ && $NF+0 < threshold {print "  - " $1 ": " $NF}'
              exit 1
          else
              echo "✅ Coverage check passed: ${COVERAGE_OUTPUT}% >= ${COVERAGE_THRESHOLD}%"
          fi

  test-cli-basics:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras

      - name: Test shotgun version
        run: |
          source .venv/bin/activate
          shotgun --version

      - name: Test shotgun help
        run: |
          source .venv/bin/activate
          shotgun --help

  test-cli-research:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras

      - name: Test research command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun research --non-interactive "What is the capital of Poland?"

  test-cli-plan:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras

      - name: Test plan command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun plan --non-interactive "Build a simple Agent using Pydantic AI"

  test-cli-tasks:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras

      - name: Test tasks command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun tasks --non-interactive "Create the tasks for building a simple Agent using Pydantic AI"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [validate-pr-title, basic-pr-check, test-cli-basics, test-cli-research, test-cli-plan, test-cli-tasks]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "validate-pr-title: ${{ needs.validate-pr-title.result }}"
          echo "basic-pr-check: ${{ needs.basic-pr-check.result }}"
          echo "test-cli-basics: ${{ needs.test-cli-basics.result }}"
          echo "test-cli-research: ${{ needs.test-cli-research.result }}"
          echo "test-cli-plan: ${{ needs.test-cli-plan.result }}"
          echo "test-cli-tasks: ${{ needs.test-cli-tasks.result }}"

          if [[ "${{ needs.validate-pr-title.result }}" != "success" || \
                "${{ needs.basic-pr-check.result }}" != "success" || \
                "${{ needs.test-cli-basics.result }}" != "success" || \
                "${{ needs.test-cli-research.result }}" != "success" || \
                "${{ needs.test-cli-plan.result }}" != "success" || \
                "${{ needs.test-cli-tasks.result }}" != "success" ]]; then
            echo "❌ One or more required checks failed or were cancelled"
            exit 1
          else
            echo "✅ All checks have passed successfully!"
          fi