name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  basic-pr-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run ruff
        run: uv run ruff check .
        
      - name: Run ruff format check
        run: uv run ruff format --check .
        
      - name: Run mypy
        run: uv run mypy src/

  basic-cli-smoke-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Create virtual environment
        run: uv venv
        
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras
        
      - name: Test shotgun version
        run: |
          source .venv/bin/activate
          shotgun --version
        
      - name: Test shotgun help
        run: |
          source .venv/bin/activate
          shotgun --help
        
      - name: Test plan command
        run: |
          source .venv/bin/activate
          shotgun plan "Build a test application"
        
      - name: Test research command
        run: |
          source .venv/bin/activate
          shotgun research "What is testing?"
        
      - name: Test tasks command
        run: |
          source .venv/bin/activate
          shotgun tasks "Create a test project"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [basic-pr-check, basic-cli-smoke-tests]
    
    steps:
      - name: All checks passed
        run: echo "All checks have passed successfully!"