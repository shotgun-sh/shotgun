name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  COVERAGE_THRESHOLD: 61.0

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          # NOTE: Keep these types in sync with cz_conventional_commits in pyproject.toml
          # Standard Conventional Commits types as used by commitizen
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          validateSingleCommit: false
          ignoreLabels: |
            skip-validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  basic-pr-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run ruff
        run: uv run ruff check src/
        
      - name: Run ruff format check
        run: uv run ruff format --check src/
        
      - name: Run mypy
        run: uv run mypy src/
        
      - name: Run unit tests with coverage
        run: uv run pytest test/unit/ --cov=src --cov-report= --cov-append

      - name: Run integration tests with coverage (stop on first failure)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run pytest test/integration/ -x --cov=src --cov-report= --cov-append -c pyproject.toml

      - name: Generate coverage reports
        run: |
          uv run coverage report --show-missing
          uv run coverage xml
        
      - name: Check core coverage (${{ env.COVERAGE_THRESHOLD }}% minimum, excluding CLI/TUI)
        run: |
          # Use combined coverage data from both unit and integration tests
          # excluding CLI and TUI directories
          echo "Checking combined coverage for core functionality (excluding CLI/TUI)..."

          # Run coverage report with specific omit patterns for CLI/TUI and extract percentage
          COVERAGE_LINE=$(uv run coverage report --omit="*/cli/*,*/tui/*" | grep "^TOTAL" | awk '{print $NF}' | sed 's/%//')
          COVERAGE_OUTPUT=${COVERAGE_LINE:-0}

          echo "Core coverage: ${COVERAGE_OUTPUT}%"
          echo ""
          echo "Current coverage by file (excluding CLI/TUI):"
          uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing
          echo ""

          # Check if coverage meets threshold using bc for decimal comparison
          if (( $(echo "${COVERAGE_OUTPUT} < ${COVERAGE_THRESHOLD}" | bc -l) )); then
              echo "❌ Coverage check failed: ${COVERAGE_OUTPUT}% < ${COVERAGE_THRESHOLD}%"
              echo ""
              echo "Please add tests to improve coverage of core functionality"
              echo "Focus on: agents/, config/, tools/, models/, history/ directories"
              echo ""
              echo "Low coverage files that need attention:"
              uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing | grep -E "^\w" | awk -v threshold="${COVERAGE_THRESHOLD}" '$NF ~ /%/ && $NF+0 < threshold {print "  - " $1 ": " $NF}'
              exit 1
          else
              echo "✅ Coverage check passed: ${COVERAGE_OUTPUT}% >= ${COVERAGE_THRESHOLD}%"
          fi

  basic-cli-smoke-tests:
    runs-on: ubuntu-latest
    needs: [basic-pr-check]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Create virtual environment
        run: uv venv
        
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras
        
      - name: Test shotgun version
        run: |
          source .venv/bin/activate
          shotgun --version
        
      - name: Test shotgun help
        run: |
          source .venv/bin/activate
          shotgun --help
        
      - name: Test research command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun research --non-interactive "How can I make a simple Agent using Pydantic AI?"

      - name: Test plan command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun plan --non-interactive "Build a simple Agent using Pydantic AI"
        
      - name: Test tasks command
        env:
          SHOTGUN_LOG_LEVEL: DEBUG
        run: |
          source .venv/bin/activate
          shotgun tasks --non-interactive "Create the tasks for building a simple Agent using Pydantic AI"

  todo-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Todos
        uses: phntmxyz/pr_todo_checker@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude: |
            *.md
            **/__pycache__/**
            **/.pytest_cache/**
            **/config/*.yml
          comment_on_todo: true
          comment_body: |
            "A new Todo was discovered. If it is not a priority right now, consider marking it for later attention.\n{todo}\n"
          comment_checkbox: 'Ignore'
          custom_todo_matcher: "{'py': ['#'], 'yml': ['#'], 'yaml': ['#']}"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [validate-pr-title, basic-pr-check, basic-cli-smoke-tests, todo-checker]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "validate-pr-title: ${{ needs.validate-pr-title.result }}"
          echo "basic-pr-check: ${{ needs.basic-pr-check.result }}"
          echo "basic-cli-smoke-tests: ${{ needs.basic-cli-smoke-tests.result }}"
          echo "todo-checker: ${{ needs.todo-checker.result }}"
          
          if [[ "${{ needs.validate-pr-title.result }}" != "success" || \
                "${{ needs.basic-pr-check.result }}" != "success" || \
                "${{ needs.basic-cli-smoke-tests.result }}" != "success" || \
                "${{ needs.todo-checker.result }}" != "success" ]]; then
            echo "❌ One or more required checks failed or were cancelled"
            exit 1
          else
            echo "✅ All checks have passed successfully!"
          fi