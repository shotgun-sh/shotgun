name: PR Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          # NOTE: Keep these types in sync with cz_conventional_commits in pyproject.toml
          # Standard Conventional Commits types as used by commitizen
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          validateSingleCommit: false
          ignoreLabels: |
            skip-validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  basic-pr-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run ruff
        run: uv run ruff check .
        
      - name: Run ruff format check
        run: uv run ruff format --check .
        
      - name: Run mypy
        run: uv run mypy src/
        
      - name: Run pytest with coverage
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing
        
      - name: Check core coverage (70% minimum, excluding CLI/TUI)
        run: |
          # Use coverage to generate a report and extract the coverage percentage
          # excluding CLI and TUI directories
          echo "Checking coverage for core functionality (excluding CLI/TUI)..."
          
          # Run coverage report with specific omit patterns for CLI/TUI and extract percentage
          COVERAGE_LINE=$(uv run coverage report --omit="*/cli/*,*/tui/*" | grep "^TOTAL" | awk '{print $NF}' | sed 's/%//')
          COVERAGE_OUTPUT=${COVERAGE_LINE:-0}
          
          echo "Core coverage: ${COVERAGE_OUTPUT}%"
          echo ""
          echo "Current coverage by file (excluding CLI/TUI):"
          uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing
          echo ""
          
          # Check if coverage meets 70% threshold using bc for decimal comparison
          if (( $(echo "${COVERAGE_OUTPUT} < 70.0" | bc -l) )); then
              echo "❌ Coverage check failed: ${COVERAGE_OUTPUT}% < 70.0%"
              echo ""
              echo "Please add tests to improve coverage of core functionality"
              echo "Focus on: agents/, config/, tools/, models/, history/ directories"
              echo ""
              echo "Low coverage files that need attention:"
              uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing | grep -E "^\w" | awk '$NF ~ /%/ && $NF+0 < 70 {print "  - " $1 ": " $NF}'
              exit 1
          else
              echo "✅ Coverage check passed: ${COVERAGE_OUTPUT}% >= 70.0%"
          fi

  basic-cli-smoke-tests:
    runs-on: ubuntu-latest
    needs: [basic-pr-check]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Create virtual environment
        run: uv venv
        
      - name: Install dependencies
        run: |
          source .venv/bin/activate
          uv sync --all-extras
        
      - name: Test shotgun version
        run: |
          source .venv/bin/activate
          shotgun --version
        
      - name: Test shotgun help
        run: |
          source .venv/bin/activate
          shotgun --help
        
      - name: Test research command
        run: |
          source .venv/bin/activate
          shotgun research --non-interactive --verbose "How can I make a simple Agent using Pydantic AI?"

      - name: Test plan command
        run: |
          source .venv/bin/activate
          shotgun plan --non-interactive --verbose "Build a simple Agent using Pydantic AI"
        
      - name: Test tasks command
        run: |
          source .venv/bin/activate
          shotgun tasks --non-interactive --verbose "Create the tasks for building a simple Agent using Pydantic AI"

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [validate-pr-title, basic-pr-check, basic-cli-smoke-tests]
    if: always()
    
    steps:
      - name: Check job results
        run: |
          echo "validate-pr-title: ${{ needs.validate-pr-title.result }}"
          echo "basic-pr-check: ${{ needs.basic-pr-check.result }}"
          echo "basic-cli-smoke-tests: ${{ needs.basic-cli-smoke-tests.result }}"
          
          if [[ "${{ needs.validate-pr-title.result }}" != "success" || \
                "${{ needs.basic-pr-check.result }}" != "success" || \
                "${{ needs.basic-cli-smoke-tests.result }}" != "success" ]]; then
            echo "❌ One or more required checks failed or were cancelled"
            exit 1
          else
            echo "✅ All checks have passed successfully!"
          fi