name: Main Branch Integration Tests

on:
  workflow_dispatch:  # Manual trigger only

env:
  COVERAGE_THRESHOLD: 51.0

# Cancel in-progress runs when new commits arrive on main
concurrency:
  group: main-integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run all tests with coverage
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🧪 Running all tests (unit + integration) on main branch..."
          uv run pytest test/ -v --cov=src --cov-report= -c pyproject.toml

      - name: Generate coverage reports
        if: always()
        run: |
          uv run coverage report --show-missing
          uv run coverage xml

      - name: Check core coverage (${{ env.COVERAGE_THRESHOLD }}% minimum, excluding CLI/TUI)
        if: always()
        id: coverage_check
        run: |
          # Use coverage data from integration tests
          # excluding CLI and TUI directories
          echo "Checking integration test coverage for core functionality (excluding CLI/TUI)..."

          # Run coverage report with specific omit patterns for CLI/TUI and extract percentage
          COVERAGE_LINE=$(uv run coverage report --omit="*/cli/*,*/tui/*" | grep "^TOTAL" | awk '{print $NF}' | sed 's/%//')
          COVERAGE_OUTPUT=${COVERAGE_LINE:-0}

          echo "Core coverage: ${COVERAGE_OUTPUT}%"
          echo "coverage_percentage=${COVERAGE_OUTPUT}" >> $GITHUB_OUTPUT
          echo ""
          echo "Current coverage by file (excluding CLI/TUI):"
          uv run coverage report --omit="*/cli/*,*/tui/*" --show-missing
          echo ""

          # Check if coverage meets threshold using bc for decimal comparison
          if (( $(echo "${COVERAGE_OUTPUT} < ${COVERAGE_THRESHOLD}" | bc -l) )); then
              echo "❌ Coverage check failed: ${COVERAGE_OUTPUT}% < ${COVERAGE_THRESHOLD}%"
              echo "coverage_status=failed" >> $GITHUB_OUTPUT
              exit 1
          else
              echo "✅ Coverage check passed: ${COVERAGE_OUTPUT}% >= ${COVERAGE_THRESHOLD}%"
              echo "coverage_status=passed" >> $GITHUB_OUTPUT
          fi

  notify-slack-failure:
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: failure()

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # Get current and previous commit for comparison

      - name: Get commit information
        id: commit_info
        run: |
          # Get commit hash and message
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")

          # Get branch name (should be main)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # Store outputs
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "commit_short=${COMMIT_SHORT}" >> $GITHUB_OUTPUT
          echo "commit_message=${COMMIT_MESSAGE}" >> $GITHUB_OUTPUT
          echo "commit_author=${COMMIT_AUTHOR}" >> $GITHUB_OUTPUT
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT

          # Get the PR number if this was a merge commit
          PR_NUMBER=$(git log -1 --pretty=format:"%s" | grep -oP '#\K[0-9]+' || echo "")
          echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SHOTGUN_ALPHA_WEBHOOK }}
        run: |
          # Prepare variables
          COMMIT_SHA="${{ steps.commit_info.outputs.commit_short }}"
          COMMIT_MESSAGE="${{ steps.commit_info.outputs.commit_message }}"
          COMMIT_AUTHOR="${{ steps.commit_info.outputs.commit_author }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          COMMIT_URL="${REPO_URL}/commit/${{ steps.commit_info.outputs.commit_sha }}"

          # Add PR link if available
          PR_NUMBER="${{ steps.commit_info.outputs.pr_number }}"
          if [[ -n "$PR_NUMBER" ]]; then
            PR_LINK=" (<${REPO_URL}/pull/${PR_NUMBER}|#${PR_NUMBER}>)"
          else
            PR_LINK=""
          fi

          # Create Slack message
          cat <<EOF > /tmp/slack_payload.json
          {
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "⚠️ Main Branch Integration Tests Failed",
                  "emoji": true
                }
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*The main branch is currently broken!* Integration tests are failing after a recent merge."
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${COMMIT_URL}|${COMMIT_SHA}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Author:*\n${COMMIT_AUTHOR}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Message:*\n${COMMIT_MESSAGE}${PR_LINK}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Failed Workflow:*\n<${WORKFLOW_URL}|View Details>"
                  }
                ]
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*🔧 Recommended Actions:*\n1. Check the <${WORKFLOW_URL}|failed workflow> for error details\n2. Fix the issue with a new PR, or\n3. Revert the commit if needed:\n   \`git revert ${COMMIT_SHA}\`"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Repository: <${REPO_URL}|${{ github.repository }}> | Time: <!date^$(date +%s)^{date_pretty} at {time}|$(date)>"
                  }
                ]
              }
            ]
          }
          EOF

          # Send to Slack
          curl -X POST -H 'Content-type: application/json' \
            --data @/tmp/slack_payload.json \
            "$SLACK_WEBHOOK_URL"

          echo "❗ Slack notification sent: Main branch integration tests failed"