pre-commit:
  parallel: true
  commands:
    ruff:
      run: uv run ruff check --fix {staged_files}
      glob: "*.py"
      stage_fixed: true
    ruff-format:
      run: uv run ruff format {staged_files}
      glob: "*.py"
      stage_fixed: true
    mypy:
      run: uv run mypy {staged_files}
      glob: "*.py"
      exclude: "(^test/|hatch_build\\.py)"
    trufflehog-main:
      run: trufflehog git file://. --since-commit HEAD --fail --no-update --exclude-globs=uv.lock
    trufflehog-lockfile:
      run: trufflehog git file://. --since-commit HEAD --fail --no-update --include-paths=.trufflehog-include-lockfile.txt --exclude-detectors=SentryToken
    actionlint:
      run: actionlint {staged_files}
      glob: ".github/workflows/*.yml"
      skip: true

commit-msg:
  commands:
    commitizen:
      run: uv run cz check --commit-msg-file {1}
