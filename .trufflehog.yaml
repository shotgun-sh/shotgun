# Trufflehog configuration
# Note: We use CLI flags instead of this config file for better compatibility
# with both pre-commit hooks and CI/CD pipelines.
#
# This file is kept for documentation purposes and can be used with --config flag if needed.

## Two-Pass Scanning Strategy (Defense-in-Depth)

We run trufflehog twice for maximum security while avoiding false positives:

### Pass 1: Scan everything except uv.lock
- Command: `trufflehog git file://. --exclude-globs=uv.lock`
- All detectors enabled (OpenAI, Anthropic, AWS, GitHub, SentryToken, etc.)
- Excludes uv.lock to avoid false positives from package hashes

### Pass 2: Scan ONLY uv.lock without SentryToken detector
- Command: `trufflehog git file://. --include-paths=.trufflehog-include-lockfile.txt --exclude-detectors=SentryToken`
- Uses `.trufflehog-include-lockfile.txt` (contains regex: ^uv\.lock$)
- Excludes SentryToken detector (Sentry SDK checksums trigger false positives)
- Still catches other secret types (OpenAI, Anthropic, AWS, etc.) if they somehow end up in uv.lock

### Why This Approach?

Package lock files (uv.lock, package-lock.json, yarn.lock) normally only contain:
- Package names and versions
- Download URLs from package indexes
- SHA256 checksums for integrity verification

However, in rare edge cases, secrets COULD appear in uv.lock:
- Compromised packages with secrets in names/versions
- Private package indexes with credentials embedded in URLs
- Supply chain attacks

The two-pass approach catches these edge cases while eliminating false positives.
